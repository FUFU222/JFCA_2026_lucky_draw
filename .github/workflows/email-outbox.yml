name: Email outbox retry worker

# Vercel Cron on the Hobby plan runs once a day, which would leave a failed
# confirmation email undelivered for up to 24 hours — unusable for a one-day
# event. GitHub Actions' schedule trigger has no plan-tier restriction, so the
# retry worker is driven from here instead. The application endpoint itself is
# unchanged: this workflow is only a different caller of the same authenticated
# route.
on:
  schedule:
    # Every 5 minutes, GitHub's shortest supported interval. GitHub also warns
    # that scheduled runs can be delayed under load, especially at the top of
    # the hour, so this is a target cadence, not a guarantee.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  process-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the outbox endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET repository secrets must both be set" >&2
            exit 1
          fi

          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -X POST "$APP_URL/api/internal/email-outbox" \
            -H "Authorization: Bearer $CRON_SECRET")

          echo "HTTP $status"
          cat /tmp/response.json
          echo

          if [ "$status" -ge 400 ]; then
            echo "Outbox call failed with status $status" >&2
            exit 1
          fi
