name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # `tsc --noEmit` needs `next-env.d.ts` and `.next/types/`, which only
      # exist once something in the Next.js CLI has generated them. Nothing
      # before this step does: `lint` runs plain `eslint .`, not `next lint`.
      # Locally that file survives from whatever `next` command was last run,
      # so this was invisible outside CI — every push to `main` has failed
      # here since at least 2026-07-29. `next typegen` is the lightest command
      # that writes both, well under a second, with no build.
      - name: Generate Next.js type declarations
        run: pnpm exec next typegen

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The database suites must actually run here. When they skipped, a
      # migration that Postgres could not even parse passed CI.
      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Export Supabase test credentials
        run: |
          status="$(pnpm exec supabase status -o json)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$status" | jq -r .API_URL)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$status" | jq -r .SERVICE_ROLE_KEY)"
          } >> "$GITHUB_ENV"

      - name: Unit and integration tests
        run: pnpm test

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

      - name: Production build
        run: pnpm build
